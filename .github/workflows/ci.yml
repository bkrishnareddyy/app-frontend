name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qubere_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qubere_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qubere_shadow
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qubere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations from scratch
        run: npx prisma migrate deploy

      - name: Verify migrations are replay-safe
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Generate Prisma schema drift SQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres qubere_shadow
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > prisma-drift.sql

      - name: Upload Prisma schema drift SQL
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema-drift
          path: prisma-drift.sql
          if-no-files-found: error
          retention-days: 3

      - name: Verify Prisma schema matches migration history
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: OpenAPI generation must not error
        run: npm run openapi

      - name: Production build
        run: npm run build
